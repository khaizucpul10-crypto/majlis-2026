<!DOCTYPE html>
<html lang="ms">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="config.js"></script>

<title>Login Admin</title>

<style>

body{
    margin:0;
    font-family:Segoe UI;
    background:#f4f6fb;
}

.login-box{

    width:350px;
    max-width:90%;
    margin:80px auto;

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

}

h2{

text-align:center;

color:#1e3a8a;

}

input{

width:100%;

padding:15px;

margin-top:15px;

font-size:16px;

box-sizing:border-box;

}

button{

width:100%;

padding:15px;

margin-top:20px;

font-size:16px;

background:#16a34a;

color:white;

border:none;

border-radius:8px;

cursor:pointer;

}

button:hover{

background:#15803d;

}

.error{

margin-top:15px;

text-align:center;

color:red;

}

</style>

</head>

<body>

<div class="login-box">

<h2>Dashboard Admin</h2>

<input
id="user"
placeholder="Username">

<input
id="pass"
type="password"
placeholder="Password">

<button onclick="login()">

LOGIN

</button>

<div id="msg" class="error"></div>

</div>

<script>

function login(){

let u=document.getElementById("user").value.trim();

let p=document.getElementById("pass").value;

if(

u==ADMIN_USER

&&

p==ADMIN_PASS

){

sessionStorage.setItem("admin","true");

window.location="dashboard.html";

}
else{

document.getElementById("msg").innerHTML="Username atau Password salah.";

}

}

</script>

</body>
</html>
