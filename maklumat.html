<!DOCTYPE html>

<html>
	<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="config.js"></script>
	<style>
		body{
			margin:0;
			font-family:Segoe UI;
			background:#f4f6fb;
		}

		/* HEADER */
		.header{
			background:#1e3a8a;
			color:white;
			padding:15px;
			text-align:center;
			font-weight:bold;
		}

		/* CARD */
		.card{
			background:#fffce4;
			margin:20px;
			padding:20px;
			border-radius:15px;
			box-shadow:0 5px 15px rgba(0,0,0,0.1);
			text-align:center;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
		}

		/* PROFILE */
		.profile{
			width:80px;
			height:80px;
			border-radius:50%;
			background:#1e3a8a;
			margin:auto;
		}

		/* NAME */
		.name{
			font-size:20px;
			font-weight:bold;
			margin-top:10px;
		}

		.ic{
			background:#eef2ff;
			display:inline-block;
			padding:5px 12px;
			border-radius:20px;
			margin-top:5px;
		}

		/* INFO */
		.row{
			display:flex;
			justify-content:space-between;
			margin-top:15px;
			font-size:14px;
		}

		.big{
			font-size:28px;
			font-weight:bold;
			color:#16a34a;
		}

		/* BUTTON */
		.btn{
			width:100%;
			padding:15px;
			border:none;
			border-radius:10px;
			margin-top:15px;
			font-size:16px;
		}

		.green{
			background:#16a34a;
			color:white;
		}

		.gray{
			background:#e5e7eb;
		}
		
		.logo{
			width:80px;
			height:auto;
		}
		
		.welcome{
			font-size:18px;
			font-weight:bold;
			text-align:center;
			color:#1e3a8a;
			font-family:cursive;
		}
		
		#statusBox{
			display:none;
			background:#dcfce7;
			border-left:6px solid #16a34a;
			color:#166534;
			text-align:center;
			padding:15px;
			border-radius:10px;
			margin:15px 0;
			font-weight:bold;
		}
		
	</style>

</head>

<body>

<div class="header">MAKLUMAT TETAMU</div>

<div class="card">
	<img src="images/jatanegarayellowsmall.png" class="logo" alt=""><br>
		<!--div class="profile"></div-->

<div class="welcome" style="color:#1e3a8a;">
    Majlis Anugerah Perkhidmatan Cemerlang <br>
    PPD TAWAU Tahun 2026
</div><br>

<div class="name" id="nama"></div>
<div class="perjawatan" id="jawatan"></div><br>		<!--new add-->
<div class="ic" id="noic"></div><br><br>

<div class="row">
    <div>Tempat Bertugas</div>
    <div id="tempat"></div>
</div>

<div class="row">
    <div>Kategori</div>
    <div id="ket"></div>
</div>

<hr>
<div id="statusBox"></div>

<div class="row">
    <div>No. Meja</div>
    <div class="big" id="meja"></div>
</div>

<div class="row">
    <div>No. Kerusi</div>
    <div class="big" id="kerusi"></div>
</div>

<!--button class="btn green" onclick="sahHadir()">✔ SAHKAN KEHADIRAN</button-->
<button id="btnHadir" class="btn green" onclick="sahHadir()">
    ✔ SILA SAHKAN KEHADIRAN
</button>

<button
    id="btnKembali"
    class="btn gray"
    onclick="kembali()"
    style="display:none;">
    ← KEMBALI
</button>
<br><br>

<!--button class="btn gray" onclick="kembali()">↻ KEMBALI IMBAS</button-->

</div>

<script>
const user = JSON.parse(localStorage.getItem("peserta"));

if(user){

    document.getElementById("nama").innerText = user.nama;
    document.getElementById("noic").innerText = "No. IC: " + user.ic;
    document.getElementById("jawatan").innerText = user.jawatan;
    document.getElementById("tempat").innerText = user.tempat;
    document.getElementById("ket").innerText = user.gred;
    document.getElementById("meja").innerText = user.meja;
    document.getElementById("kerusi").innerText = user.kerusi;
	updateButtonStatus(user);
}else{

    document.querySelector(".card").innerHTML=`
	<h2>❌ Data tidak dijumpai</h2>
	<p>Kembali ke halaman utama...</p>
	`;

	setTimeout(function(){
		window.location.href="index.html";
	},3000);
}

// BUTTON
async function sahHadir(){
	
	const btn = document.getElementById("btnHadir");

    if(btn.disabled) return;
	
    const peserta = JSON.parse(localStorage.getItem("peserta"));
	if(!confirm("Adakah anda ingin mengesahkan kehadiran?")){
		return;
	}

    if(!peserta){
        alert("Maklumat peserta tidak dijumpai.");
        window.location.href = "index.html";
        return;
    }

    btn.disabled = true;
    btn.innerHTML="⏳ Sedang merekod...";

    try{

        const response = await fetch(
            API_URL +
            "?action=hadir&ic=" +
            encodeURIComponent(peserta.ic)
        );

        const result = await response.json();

        if(result.status){

            peserta.hadir="HADIR";
			peserta.tarikh=result.tarikh;
			peserta.masa=result.masa;

			localStorage.setItem(
				"peserta",
				JSON.stringify(peserta)
			);

            updateButtonStatus(peserta);

        }else{

            

            if(result.message.includes("telah hadir")){

				peserta.hadir="HADIR";
				peserta.tarikh=result.tarikh;
				peserta.masa=result.masa;

				localStorage.setItem(
					"peserta",
					JSON.stringify(peserta)
				);

				updateButtonStatus(peserta);
			}else{
				alert(result.message);
                btn.disabled = false;
                btn.innerHTML = "✔ SAHKAN KEHADIRAN";

            }

        }

    }catch(err){

        btn.disabled = false;
        btn.innerHTML = "✔ SAHKAN KEHADIRAN";

        console.log(err);
        alert("Tidak dapat berhubung dengan server.");

    }

}

	function updateButtonStatus(user){

    if(user && user.hadir==="HADIR"){

        document.getElementById("btnHadir").style.display="none";
        document.getElementById("btnKembali").style.display="block";

        const box=document.getElementById("statusBox");

        box.style.display="block";

        box.innerHTML=`
            
            <div style="font-size:15px;font-weight:bold;margin-top:8px;">
                ✅ Kehadiran Berjaya Direkod
            </div>

            <div style="margin-top:8px;font-size:13px;">
				${user.tarikh && user.masa ? user.tarikh + " " + user.masa : ""}
			</div>
        `;
    }

}

	function kembali(){
		localStorage.removeItem("peserta");
		window.location.href="index.html";
	}

</script>

</body>
</html>
