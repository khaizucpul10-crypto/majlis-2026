<!DOCTYPE html>

<html>
	<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<style>
		body{
			margin:0;
			font-family:Segoe UI;
			background:#f4f6fb;
		}

		/* HEADER */
		.header{
			background:#1e3a8a;
			color:white;
			padding:15px;
			text-align:center;
			font-weight:bold;
		}

		/* CARD */
		.card{
			background:#fffce4;
			margin:20px;
			padding:20px;
			border-radius:15px;
			box-shadow:0 5px 15px rgba(0,0,0,0.1);
			text-align:center;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
		}

		/* PROFILE */
		.profile{
			width:80px;
			height:80px;
			border-radius:50%;
			background:#1e3a8a;
			margin:auto;
		}

		/* NAME */
		.name{
			font-size:20px;
			font-weight:bold;
			margin-top:10px;
		}

		.ic{
			background:#eef2ff;
			display:inline-block;
			padding:5px 12px;
			border-radius:20px;
			margin-top:5px;
		}

		/* INFO */
		.row{
			display:flex;
			justify-content:space-between;
			margin-top:15px;
			font-size:14px;
		}

		.big{
			font-size:28px;
			font-weight:bold;
			color:#16a34a;
		}

		/* BUTTON */
		.btn{
			width:100%;
			padding:15px;
			border:none;
			border-radius:10px;
			margin-top:15px;
			font-size:16px;
		}

		.green{
			background:#16a34a;
			color:white;
		}

		.gray{
			background:#e5e7eb;
		}
	</style>

</head>

<body>

<div class="header">MAKLUMAT TETAMU</div>

<div class="card">
	<img src="images/jatanegarayellowsmall.png" class="logo" alt=""><br><br>
		<!--div class="profile"></div-->

<div class="name" id="nama"></div>
<div class="perjawatan" id="jawatan"></div><br>		<!--new add-->
<div class="ic" id="noic"></div><br><br>

<div class="row">
    <div>Tempat Bertugas</div>
    <div id="tempat"></div>
</div>

<div class="row">
    <div>Kenaikan Gred</div>
    <div id="ket"></div>
</div>

<hr>

<div class="row">
    <div>No. Meja</div>
    <div class="big" id="meja"></div>
</div>

<div class="row">
    <div>No. Kerusi</div>
    <div class="big" id="kerusi"></div>
</div>

<button class="btn green" onclick="sahHadir()">✔ SAHKAN KEHADIRAN</button><br><br>

<!--button class="btn gray" onclick="kembali()">↻ KEMBALI IMBAS</button-->

</div>

<script>

let user = JSON.parse(localStorage.getItem("peserta"));

if(user){

    document.getElementById("nama").innerText = user.nama;
    document.getElementById("noic").innerText = "No. IC: " + user.ic;
    document.getElementById("jawatan").innerText = user.jawatan;
    document.getElementById("tempat").innerText = user.tempat;
    document.getElementById("ket").innerText = user.gred;
    document.getElementById("meja").innerText = user.meja;
    document.getElementById("kerusi").innerText = user.kerusi;

}else{

    document.querySelector(".card").innerHTML =
        "<h2>❌ Data tidak dijumpai</h2>";

}

// BUTTON
function sahHadir(){

    let user = JSON.parse(localStorage.getItem("peserta"));

    if(!user){
        alert("Data peserta tidak dijumpai.");
        return;
    }

    alert(
        "✅ Kehadiran berjaya direkod.\n\n" +
        "Nama : " + user.nama +
        "\nNo KP : " + user.ic +
        "\nMeja : " + user.meja +
        "\nKerusi : " + user.kerusi
    );

    window.location.href = "index.html";

}


function kembali(){
    window.location.href="scan.html";
}

</script>

</body>
</html>
