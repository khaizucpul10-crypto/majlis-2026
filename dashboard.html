<!DOCTYPE html>
<html lang="ms">
<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">

	<script src="config.js"></script>

	<title>Dashboard Kehadiran</title>

	<style>
		body{
			margin:0;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
			background:#f4f6fb;
			}

		.header{
			background:#1e3a8a;
			color:white;
			padding:10px 18px;
			text-align:center;
			font-size:24px;
			font-weight:bold;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
		}

		@media (max-width:768px){
			.header>div{
				flex-direction:column;
				gap:15px;
			}

			.dashboardLayout{
				grid-template-columns:1fr;
			}
		}

		.container{
			width:95%;
			margin:auto;
			}
			
		.dashboardLayout{
			display:grid;
			grid-template-columns:320px minmax(0,1fr);
			gap:18px;
			align-items:start;
		}

		.leftPanel{
			display:flex;
			flex-direction:column;
			gap:15px;
		}

		.rightPanel{display:flex; flex-direction:column;}

		.cards{
			display:grid;
			grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
			gap:10px;
			margin-top:8px;
			}

			.card:nth-child(1){background:#2563eb;	}
			.card:nth-child(2){background:#16a34a;	}
			.card:nth-child(3){background:#dc2626;	}
			.card:nth-child(4){background:#7c3aed;	}			
			.card:nth-child(5){background:#186A7D;	color:#1e3a8a;	}

		.card h3{
			margin:0;
			color:white;
			font-size:14px;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
			}

		.card h1{
				margin-top:8px;
				color:white;
				font-size:22px;
				font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
			}

		.card{
			color:white;
			border-radius:15px;
			padding:10px;
			color:white;
			box-shadow:0 8px 18px rgba(0,0,0,.15);
		}

		.search{margin-top:20px;}

		.search input{
			width:100%;
			max-width:450px;
			padding:12px 16px;
			border-radius:10px;
			border:1px solid #d1d5db;
			outline:none;
			transition:.3s;
		}

		.search input:focus{
			border-color:#2563eb;
			box-shadow:0 0 0 3px rgba(37,99,235,.15);
		}

		table{
			width:100%;
			min-width:900px;
			border-collapse:collapse;
			background:white;
			table-layout:fixed;
		}

		td{
			border-bottom:1px solid #eee;
			padding:6px;
			font-size:12px;
			white-space:nowrap;
			overflow:hidden;
			text-overflow:ellipsis;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
		}

		.hadir{
			display:inline-block;
			padding:4px 10px;
			border-radius:20px;
			background:#dcfce7;
			color:#166534;
			font-weight:bold;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
		}

		.belum{
			display:inline-block;
			padding:4px 10px;
			border-radius:20px;
			background:#fee2e2;
			color:#991b1b;
			font-weight:bold;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
		}

		.footer{
			text-align:center;
			margin:20px;
			color:#777;
		}

		.baruHadir td{
			animation: blinkRow 0.8s ease-in-out infinite;
			background: #bbf7d0 !important;
			transition: background .3s;
		}

		@keyframes blinkRow{
			0%{
				background:#bbf7d0;
			}

			50%{
				background:#ffffff;
			}

			100%{
				background:#bbf7d0;
			}
		}

		thead{
			position:sticky;
			top:0;
			z-index:2;
			}

		.table-container{
			background:white;
			border-radius:10px;
			box-shadow:0 3px 10px rgba(0,0,0,.1);			
			max-height:550px;
			min-height:450px;
			overflow:auto;
		}
			
		.popNumber{
			animation: popNumber .6s ease;
		}

		@keyframes popNumber{
			0%{
				transform:scale(1);
			}

			40%{
				transform:scale(1.35);
			}

			100%{
				transform:scale(1);
			}
		}
		
		.progressBox{
			margin-top:15px;
			background:white;
			padding:20px;
			border-radius:15px;
			box-shadow:0 5px 15px rgba(0,0,0,.08);
		}

		.progressTitle{
			font-size:18px;
			font-weight:bold;
			margin-bottom:15px;
			color:#1e3a8a;
		}

		.progressBar{
			width:100%;
			height:28px;
			background:#e5e7eb;
			border-radius:50px;
			overflow:hidden;
		}

		.progressFill{
			width:0%;
			height:100%;
			background:linear-gradient(90deg,#16a34a,#22c55e);
			transition:width .8s ease;
			animation:progressGlow 2s infinite;
			}

		@keyframes progressGlow{
			0%{filter:brightness(1);}
			50%{filter:brightness(1.15);}
			100%{filter:brightness(1);}
		}

		@media(max-width:768px){
			.progressText{
			font-size:12px;
			color:white;
			margin-top:12px;
			text-align:center;
			font-weight:bold;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
			}
		}
		
		.activityBox{
			background:white;
			border-radius:15px;
			padding:20px;
			box-shadow:0 5px 15px rgba(0,0,0,.1);
			max-height:320px;
			overflow-y:auto;
		}

		.activityBox h3{
			margin-top:0;
			color:#1e3a8a;
		}

		.activityItem{
			background:#f8fafc;
			border-left:5px solid #16a34a;
			border-radius:10px;
			padding:12px;
			margin-bottom:12px;
			box-shadow:0 2px 6px rgba(0,0,0,.08);
			transition:.3s;
		}
		
		.activityLatest{
			background:linear-gradient(
				135deg,
				#fff7cc,
				#ffe082
			);

			border-left:6px solid #f59e0b;
			animation:latestPulse 1s infinite;
		}
		
		@keyframes latestPulse{
			0%{
				transform:scale(1);
				box-shadow:0 0 0 rgba(245,158,11,.5);
			}

			50%{
				transform:scale(1.03);
				box-shadow:0 0 20px rgba(245,158,11,.7);
			}

			100%{
				transform:scale(1);
				box-shadow:0 0 0 rgba(245,158,11,.5);
			}
		}

		.activityItem:hover{
			transform:translateY(-2px);
		}

		.activityTime{
			color:#16a34a;
			font-size:14px;
			font-weight:bold;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
		}

		.activityJawatan{
			color:#666;
			font-size:13px;
			margin-top:4px;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
		}

		.activityKategori{
			display:inline-block;
			margin-top:8px;
			padding:4px 10px;
			border-radius:20px;
			background:#2563eb;
			color:white;
			font-size:12px;
			font-weight:bold;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
		}

		.activitySeat{
			margin-top:8px;
			color:#444;
			font-size:13px;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
		}
		
		.activityName{
			font-size:15px;
			margin-top:3px;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
		}
		
		.categoryBox{
			background:white;
			margin-top:20px;
			border-radius:15px;
			padding:20px;
			box-shadow:0 5px 15px rgba(0,0,0,.08);
			height:280px;
			overflow-y:auto;
		}

		.categoryBox h3{
			margin-top:0;
			color:#1e3a8a;
		}

		.categoryItem{
			margin-bottom:18px;
		}

		.categoryTitle{
			font-weight:bold;
			margin-bottom:6px;
		}

		.progressWrap{
			width:100%;
			height:18px;
			background:#e5e7eb;
			border-radius:20px;
			overflow:hidden;
		}

		.categoryInfo{
			margin-top:5px;
			font-size:13px;
			color:#666;
			font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
		}
		
		th{
			background:#1e3a8a;
			color:white;
			padding:10px;
			font-size:13px;
		}
		
		thead th{
			position:sticky;
			top:0;
			z-index:5;
		}
		
		tbody tr:nth-child(even){
			background:#fafafa;
		}

		tbody tr:hover{
			background:#dbeafe;
		}
		
		.cardPop{animation:cardPop .5s;	}

		@keyframes cardPop{
			0%{	transform:scale(.95); box-shadow:0 0 0 rgba(0,0,0,.1);	}
			50%{transform:scale(1.05); box-shadow:0 10px 30px rgba(37,99,235,.35);	}
			100%{transform:scale(1);	}
		}
		
		#liveNotification{
				animation:slideIn .4s;
			}

			@keyframes slideIn{
				from{transform:translateX(120%);	}
				to{	transform:translateX(0);	}
			}
			
	</style>
</head>

<body>
	<div class="header">
		<div style="display:flex;justify-content:space-between;align-items:center;">
			<div id="liveClock"
				style="
				margin-top:10px;
				font-size:10px;
				font-weight:bold;
				color:white;
				line-height:1.0;">
			</div>
			<div>
				<div style="font-size:20px;font-weight:bold">
					Dashboard Kehadiran
				</div>

				<div style="font-size:14px;margin-top:6px">
					Majlis Kenaikan Pangkat
				</div>

				<div style="font-size:12px">
					PPD Tawau Tahun 2026
				</div>
			</div>
			
			<button onclick="logout()"
				style="
				padding:10px 20px;
				border:none;
				border-radius:8px;
				background:#dc2626;
				color:white;
				cursor:pointer;
				font-weight:bold;">
					Logout
			</button>
		</div>
	</div>
	
	<div id="liveNotification"
		style="
        display:none;
        position:fixed;
        top:20px;
        right:20px;
        background:#16a34a;
        color:white;
        padding:15px 20px;
        border-radius:10px;
        box-shadow:0 5px 15px rgba(0,0,0,.3);
        z-index:9999;
        font-weight:bold;">
	</div>

	<div class="container">
		<div class="cards">
			<div class="card">
				<h3>Jumlah Peserta</h3>
				<h1 id="jumlah">0</h1>
			</div>
			<div class="card">
				<h3>Hadir</h3>
				<h1 id="hadir">0</h1>
			</div>
			<div class="card">
				<h3>Belum Hadir</h3>
				<h1 id="belum">0</h1>
			</div>
			<div class="card">
				<h3>Peratus</h3>
				<h1 id="peratus">0%</h1>
			</div>
			<div class="card">
				<h3>Kemajuan Kehadiran</h3>
				<!--div class="progressTitle">
					Kemajuan Kehadiran
				</div-->

				<div class="progressBar">
					<div
						id="progressFill"
						class="progressFill">
					</div>
				</div>
				<div
					id="progressText"
					class="progressText">
					0 / 0 Peserta (0%)
				</div>
			</div>
		</div><br>
		<div class="dashboardLayout">
			<div class="leftPanel">
				<!-- PANEL KIRI -->
				<!-- Kita akan masukkan Aktiviti Terkini dan Statistik Kategori pada langkah seterusnya -->
				
				<div class="activityBox">
					<h3>Aktiviti Terkini</h3>
					<div id="activityList"></div>
				</div>
				<div class="categoryBox">
					<h3>Statistik Mengikut Kategori</h3>
					<div id="categoryStats">
						Memuatkan...
					</div>
				</div>						
			</div>
			<div class="rightPanel">
				<!-- Tampal semula bahagian Search + Jadual di sini -->
				<div class="search">
					<div id="lastUpdate"
						style="
						margin-top:15px;
						text-align:right;
						color:#666;
						font-size:13px;">
						Kemaskini terakhir : -
					</div>

					<input
					type="text"
					id="carian"
					placeholder="Cari Nama atau No KP..."
					onkeyup="currentPage=1;paparJadual()">

				</div><br>
				<div id="bilRekod"></div>

				<div
					style="
					display:grid;
					grid-template-columns:3fr 1fr;
					gap:20px;
					margin-top:15px;">			

					<div class="table-container">
						<table align="center">
							<thead>
								<tr>
								<th>Bil</th>
								<th>Nama</th>
								<th>No KP</th>
								<th>Tempat</th>
								<th>Meja</th>
								<th>Kerusi</th>
								<th>Status</th>
								<th>Masa</th>
								</tr>
							</thead>
							<tbody id="senarai">
							</tbody>
						</table>
						<div id="pagination"
							 style="
								margin-top:15px;
								text-align:center;">
						</div>
					</div>
				</div>
			</div>
		</div>		
	</div>
	<!--div class="footer">
		Auto Refresh setiap 2 saat
	</div-->

	<script>
		if(sessionStorage.getItem("admin")!="true"){
			window.location.replace("login.html");
		}
		let semuaPeserta=[];		
		let pesertaLama = {};
		let pesertaHighlight = "";
		
		// Pagination
		let currentPage = 1;
		const rowsPerPage = 10;

		async function loadDashboard(){
			try{
				const response = await fetch(
					API_URL + "?action=dashboard",
					{
						cache:"no-store"
					}
				);

				if(!response.ok){
					throw new Error("Server Error");
				}

				const data = await response.json();
				const statusLama = {...pesertaLama};
				pesertaLama = {};

				document.getElementById("jumlah").textContent = data.jumlah;
				document.getElementById("hadir").textContent = data.hadir;
				document.getElementById("belum").textContent = data.belum;
				document.getElementById("peratus").textContent = data.peratus+"%";
				
				// Update Progress Bar
				document.getElementById("progressFill").style.width =
					data.peratus + "%";

				document.getElementById("progressText").textContent =
					data.hadir +
					" / " +
					data.jumlah +
					" Peserta (" +
					data.peratus +
					"%)";
				
				semuaPeserta = data.peserta || [];

				let pesertaBaru = null;

				semuaPeserta.forEach(function(p){

					// Simpan status semasa
					pesertaLama[p.ic] = p.status;

					// Jika sebelum ini BELUM HADIR, sekarang HADIR
					if(
						statusLama[p.ic] &&
						statusLama[p.ic] !== "HADIR" &&
						p.status === "HADIR"
					){
						pesertaBaru = p;
						pesertaHighlight = p.ic;
					}
				});
				
				if(pesertaBaru){
					animateCard("hadir");
					animateCard("belum");
					animateCard("peratus");
				}

				semuaPeserta.sort(function(a,b){
					if(a.status==b.status){
						return (a.nama ?? "")
						.localeCompare(
						b.nama ?? "",
						"ms",
						{
						sensitivity:"base",
						numeric:true
						});
					}
					return a.status=="HADIR" ? -1 : 1;
				});

				document.getElementById("lastUpdate").innerHTML=
				"Kemaskini terakhir : "
				+new Date().toLocaleString("ms-MY",{
					hour12:false
					});

				paparJadual();
				paparAktiviti();
				paparKategori();
				
				if (pesertaHighlight) {
					const row = document.querySelector(".baruHadir");
					if (row) {
						let on = true;
						const interval = setInterval(function () {

							row.style.backgroundColor = on ? "#bbf7d0" : "#ffffff";

							row.querySelectorAll("td").forEach(td => {
								td.style.backgroundColor = on ? "#bbf7d0" : "#ffffff";
							});

							on = !on;
						}, 500);

						setTimeout(function () {
							clearInterval(interval);
							row.querySelectorAll("td").forEach(td => {
								td.style.backgroundColor = "";
							});

							pesertaHighlight = "";
							paparJadual();
						}, 10000);
					}
				}

				if(pesertaBaru){
					const notif = document.getElementById("liveNotification");
					clearTimeout(window.notifTimer);

					notif.style.display="block";
					window.notifTimer = setTimeout(function () {
						notif.style.display = "none";
						pesertaHighlight = "";
						paparJadual();
					},10000);
					bunyiNotifikasi();

					notif.innerHTML =
						"✅ " +
						pesertaBaru.nama +
						" telah mengesahkan kehadiran.";
				}
			}

			catch(err){
				console.error(err);
				document.getElementById("lastUpdate").innerHTML =
				"❌ Sambungan ke server gagal";
			}
		}

		function paparJadual(){

			let keyword = document
				.getElementById("carian")
				.value
				.toLowerCase();

			const dataFilter = semuaPeserta.filter(function(p){
				return (
					(p.nama || "").toLowerCase().includes(keyword)

					||

					String(p.ic || "").includes(keyword)
				);
			});

			const start = (currentPage-1) * rowsPerPage;
			const end = start + rowsPerPage;
			const dataPage = dataFilter.slice(start,end);

			let html="";
			let bil = start + 1;

			dataPage.forEach(function(p){
				html += `

				<tr class="${pesertaHighlight===p.ic?'baruHadir':''}">
					<td>${bil++}</td>
					<td>${p.nama}</td>
					<td>${p.ic}</td>
					<td>${p.tempat}</td>
					<td>${p.meja}</td>
					<td>${p.kerusi}</td>
					<td class="${p.status=="HADIR"?"hadir":"belum"}">
						${p.status}
					</td>
					<td>${p.masa}</td>
				</tr>
				`;
			});

			document.getElementById("senarai").innerHTML = html;
			buatPagination(dataFilter.length);
			document.getElementById("bilRekod").innerHTML =

			`Memaparkan

			${start+1}

			-

			${Math.min(end,dataFilter.length)}

			daripada

			${dataFilter.length}

			peserta`;

		}
		
		function paparAktiviti(){
			let html = "";

			const hadir = semuaPeserta
				.filter(p => p.status === "HADIR")
				.sort(function(a,b){

					const aDate = new Date(
						(a.tarikh || "").split("/").reverse().join("-") +
						"T" +
						(a.masa || "00:00:00")
					);

					const bDate = new Date(
						(b.tarikh || "").split("/").reverse().join("-") +
						"T" +
						(b.masa || "00:00:00")
					);

					return bDate - aDate;
				})
				.slice(0,10);

			if(hadir.length===0){
				html = "Tiada aktiviti.";
			}else{

				hadir.forEach(function(p){
					html += `

					<div class="activityItem ${
						pesertaHighlight === p.ic
							? 'activityLatest'
							: ''
					}">
						<div class="activityTime">	🟢 ${p.masa}	</div>
						<div class="activityName">		${p.nama}		</div>
						<div class="activityJawatan">	${p.jawatan}	</div>
						<div class="activityKategori">	${p.gred}	</div>

						<div class="activitySeat">
							🪑 Meja <b>${p.meja}</b> |
							Kerusi <b>${p.kerusi}</b>
						</div>
					</div>
					`;
				});
			}
			document.getElementById("activityList").innerHTML = html;
		}
		
		function paparKategori(){
			const kategori = {};
			semuaPeserta.forEach(function(p){
				const namaKategori = p.gred || "Lain-lain";
				if(!kategori[namaKategori]){

					kategori[namaKategori] = {
						jumlah:0,
						hadir:0
					};
				}

				kategori[namaKategori].jumlah++;

				if(p.status==="HADIR"){
					kategori[namaKategori].hadir++;
				}
			});

			let html="";

			Object.keys(kategori)
			.sort()
			.forEach(function(k){
				const jumlah = kategori[k].jumlah;
				const hadir = kategori[k].hadir;
				const peratus = jumlah===0
					?0
					:Math.round((hadir/jumlah)*100);

				html += `

				<div class="categoryItem">
					<div class="categoryTitle">
						${k}
					</div>

					<div class="progressWrap">
						<div
							class="progressFill"
							style="width:${peratus}%">
						</div>
					</div>

					<div class="categoryInfo">
						${hadir} hadir daripada ${jumlah}
						(${peratus}%)
					</div>
				</div>
				`;
			});
			document.getElementById("categoryStats").innerHTML = html;
		}

		function buatPagination(totalData){

			const totalPages = Math.ceil(totalData / rowsPerPage);
			let html = "";

			html += `

			<button onclick="prevPage()"
				${currentPage==1?'disabled':''}>
				◀
			</button>

			`;

			for(let i=1;i<=totalPages;i++){
				if(
					i==1 ||	i==totalPages || Math.abs(i-currentPage)<=2
				){
					html += `

					<button
						onclick="goPage(${i})"

						style="
						margin:3px;
						padding:8px 12px;
						border-radius:6px;
						border:1px solid #ccc;
						cursor:pointer;
						background:	${i==currentPage?'#2563eb':'white'};
						color:	${i==currentPage?'white':'black'};">
						${i}
					</button>

					`;
				}

				else if(
					i==currentPage-3 ||	i==currentPage+3
				){
					html += "... ";
				}
			}

			html += `

			<button
				onclick="nextPage(${totalPages})"
				${currentPage==totalPages?'disabled':''}>
				▶
			</button>

			`;

			document.getElementById("pagination").innerHTML = html;
		}
		
		function goPage(page){
			currentPage = page;
			paparJadual();
		}

		function prevPage(){
			if(currentPage>1){
				currentPage--;
				paparJadual();
			}
		}

		function nextPage(totalPages){
			if(currentPage<totalPages){
				currentPage++;
				paparJadual();
			}
		}
		
		updateClock();
		setInterval(updateClock,1000);

		autoRefresh();
		
		async function autoRefresh(){
			try{
				await loadDashboard();
			}
			finally{
				setTimeout(autoRefresh,2000);
			}
		}

		function logout(){
			if(confirm("Adakah anda ingin log keluar?")){
				sessionStorage.clear();
				window.location.replace("login.html");
				}
			}

		function bunyiNotifikasi(){
			const audio = new Audio(
				"https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
			);

			audio.volume = 0.7;
			audio.play().catch(function(err){
				console.log("Audio tidak dapat dimainkan.", err);
			});
		}
		
		function animateCard(id){
			const number=document.getElementById(id);

			number.classList.remove("popNumber");
			void number.offsetWidth;
			number.classList.add("popNumber");

			const card=number.closest(".card");

			card.classList.remove("cardPop");
			void card.offsetWidth;
			card.classList.add("cardPop");
		}
		
		function updateClock(){
			const now = new Date();

			const hari = [
				"Ahad",
				"Isnin",
				"Selasa",
				"Rabu",
				"Khamis",
				"Jumaat",
				"Sabtu"
			];

			const bulan = [
				"Januari",
				"Februari",
				"Mac",
				"April",
				"Mei",
				"Jun",
				"Julai",
				"Ogos",
				"September",
				"Oktober",
				"November",
				"Disember"
			];

			const tarikh =
				hari[now.getDay()] + "<br>" +
				String(now.getDate()).padStart(2,"0") +
				" " +
				bulan[now.getMonth()] +
				" " +
				now.getFullYear();

			const masa =
				String(now.getHours()).padStart(2,"0") + ":" +
				String(now.getMinutes()).padStart(2,"0") + ":" +
				String(now.getSeconds()).padStart(2,"0");

			document.getElementById("liveClock").innerHTML =
				tarikh +
				"<br><span style='font-size:30px'>" +
				masa +
				"</span>";
		}
	</script>
