<!DOCTYPE html>
<html lang="ms">
<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">

	<script src="config.js"></script>

	<title>Dashboard Kehadiran</title>

	<style>
		body{
			margin:0;
			font-family:Segoe UI;
			background:#f4f6fb;
			}

		.header{
			background:#1e3a8a;
			color:white;
			padding:18px;
			text-align:center;
			font-size:24px;
			font-weight:bold;
			}

		.container{
			width:95%;
			margin:auto;
			}

		.cards{
			display:grid;
			grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
			gap:15px;
			margin-top:20px;
			}

			.card:nth-child(1){
			background:#2563eb;
			}

			.card:nth-child(2){
			background:#16a34a;
			}

			.card:nth-child(3){
			background:#dc2626;
			}

			.card:nth-child(4){
			background:#7c3aed;
			}

		.card h3{
			margin:0;
			color:white;
			}

		.card h1{
				margin-top:10px;
				color:white;
				font-size:42px;
			}

		.card{
			color:white;
			border-radius:15px;
			padding:20px;
			color:white;
			box-shadow:0 8px 18px rgba(0,0,0,.15);
		}

		.search{
			margin-top:20px;
		}

		.search input{
			width:400px;
			max-width:100%;
			padding:15px;
			font-size:17px;
		}

		table{
			width:100%;
			border-collapse:collapse;
			background:white;
		}

		tbody tr:hover{
			background:#eef4ff;
		}

		th{
			background:#1e3a8a;
			color:white;
			padding:12px;
		}

		td{
			padding:10px;
			border-bottom:1px solid #eee;
		}

		.hadir{
			display:inline-block;
			padding:4px 10px;
			border-radius:20px;
			background:#dcfce7;
			color:#166534;
			font-weight:bold;
		}

		.belum{
			display:inline-block;
			padding:4px 10px;
			border-radius:20px;
			background:#fee2e2;
			color:#991b1b;
			font-weight:bold;
		}

		.footer{
			text-align:center;
			margin:20px;
			color:#777;
		}

		.baruHadir{
			animation:blink 1s infinite;
			}

		@keyframes blink{

		0%{

		background:#dcfce7;

		}

		50%{

		background:#ffffff;

		}

		100%{

		background:#dcfce7;

		}

		}

		thead{
			position:sticky;
			top:0;
			z-index:10;
			}

		.table-container{
			max-height:550px;
			overflow:auto;
			background:white;
			border-radius:10px;
			box-shadow:0 3px 10px rgba(0,0,0,.1);
			}
	</style>
</head>

<body>
	<div class="header">
		<div style="display:flex;justify-content:space-between;align-items:center;">
			<div>
				<div style="font-size:28px;font-weight:bold">
					Dashboard Kehadiran
				</div>

				<div style="font-size:17px;margin-top:6px">
					Majlis Kenaikan Pangkat
				</div>

				<div style="font-size:14px">
					PPD Tawau Tahun 2026
				</div>
			</div>

			<button onclick="logout()"
				style="
				padding:10px 20px;
				border:none;
				border-radius:8px;
				background:#dc2626;
				color:white;
				cursor:pointer;
				font-weight:bold;">
					Logout
			</button>
		</div>
	</div>

	<div class="container">
		<div class="cards">
			<div class="card">
				<h3>Jumlah Peserta</h3>
				<h1 id="jumlah">0</h1>
			</div>
			<div class="card">
				<h3>Hadir</h3>
				<h1 id="hadir">0</h1>
			</div>
			<div class="card">
				<h3>Belum Hadir</h3>
				<h1 id="belum">0</h1>
			</div>
			<div class="card">
				<h3>Peratus</h3>
				<h1 id="peratus">0%</h1>
			</div>

		</div>
		
		<div id="liveNotification"
			style="
			display:none;
			margin-top:20px;
			padding:15px;
			background:#dcfce7;
			border-left:6px solid #16a34a;
			border-radius:10px;
			font-weight:bold;
			font-size:16px;">
		</div>

		<div class="search">
			<div id="lastUpdate"
				style="
				margin-top:15px;
				text-align:right;
				color:#666;
				font-size:13px;">
				Kemaskini terakhir : -
			</div>

			<input
				type="text"
				id="carian"
				placeholder="Cari Nama atau No KP..."
				onkeyup="paparJadual()">

		</div>
		<div id="bilRekod"></div>
		<div class="table-container">
			<table>
				<thead>
					<tr>
					<th>Bil</th>
					<th>Nama</th>
					<th>No KP</th>
					<th>Tempat</th>
					<th>Meja</th>
					<th>Kerusi</th>
					<th>Status</th>
					<th>Masa</th>
					</tr>
				</thead>
				<tbody id="senarai">
				</tbody>
			</table>
		</div>
	</div>

	<div class="footer">
		Auto Refresh setiap 5 saat
	</div>

	<script>
		if(sessionStorage.getItem("admin")!="true"){
			window.location.replace("login.html");
		}
		let semuaPeserta=[];
		
		let pesertaLama = {};

		async function loadDashboard(){
			try{
				const response = await fetch(
					API_URL + "?action=dashboard",
					{
						cache:"no-store"
					}
				);

				if(!response.ok){
					throw new Error("Server Error");
				}

				const data = await response.json();
				const statusLama = {...pesertaLama};
				pesertaLama = {};

				document.getElementById("jumlah").textContent = data.jumlah;
				document.getElementById("hadir").textContent = data.hadir;
				document.getElementById("belum").textContent = data.belum;
				document.getElementById("peratus").textContent = data.peratus+"%";

				semuaPeserta = data.peserta;

				let pesertaBaru = null;

				semuaPeserta.forEach(function(p){

					// Simpan status semasa
					pesertaLama[p.ic] = p.status;

					// Jika sebelum ini BELUM HADIR, sekarang HADIR
					if(
						statusLama[p.ic] &&
						statusLama[p.ic] !== "HADIR" &&
						p.status === "HADIR"
					){
						pesertaBaru = p;
					}

				});

				semuaPeserta.sort(function(a,b){

					if(a.status==b.status){
						return a.nama.localeCompare(b.nama);
					}

					return a.status=="HADIR" ? -1 : 1;

				});

				document.getElementById("lastUpdate").innerHTML=
				"Kemaskini terakhir : "
				+new Date().toLocaleTimeString("ms-MY");

				paparJadual();
				
				if(pesertaBaru){
					const notif = document.getElementById("liveNotification");
					notif.style.display = "block";

					notif.innerHTML =
						"✅ " +
						pesertaBaru.nama +
						" telah mengesahkan kehadiran.";

					setTimeout(function(){
						notif.style.display = "none";
					},5000);
				}
			}

			catch(err){

				console.error(err);

				document.getElementById("lastUpdate").innerHTML=
				"❌ Tidak dapat berhubung dengan server";
			}
		}

		function paparJadual(){

			let keyword=document
			.getElementById("carian")
			.value
			.toLowerCase();

			let html="";

			let bil=1;

			semuaPeserta.forEach(function(p){
				if(
					p.nama.toLowerCase().includes(keyword)
					||
					String(p.ic).includes(keyword)
				){
					html+=`

					<tr>
					<td>${bil++}</td>
					<td>${p.nama}</td>
					<td>${p.ic}</td>
					<td>${p.tempat}</td>
					<td>${p.meja}</td>
					<td>${p.kerusi}</td>
					<td class="${p.status=="HADIR"?"hadir":"belum"}">
					${p.status}
					</td>
					<td>${p.masa}</td>
					</tr>
		`;
				}

			});

			document.getElementById("senarai").innerHTML=html;
			document.getElementById("bilRekod").innerHTML =
			"Jumlah rekod dipaparkan : " + (bil-1);
		}

		loadDashboard();

		setInterval(async()=>{
			await loadDashboard();
		},3000);

		function logout(){
			if(confirm("Adakah anda ingin log keluar?")){
				sessionStorage.clear();
				window.location.replace("login.html");
				}
			}

	</script>

</body>
</html>
