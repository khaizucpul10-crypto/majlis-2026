			.qr-box{

</div>

	<div style="margin-top:30px;">
		
		<input type="text" id="icInput" placeholder="Masukkan No IC"
		style="width:80%; padding:12px; border-radius:10px; border:none; text-align:center; font-size:16px;">
		
		<br><br>

		<button class="btn" onclick="semakIC()">
			🔍 SEMAK
		</button>
		<br><br><br><br><br><br>
	</div>
	<script>
	async function semakIC(){

    let ic = document.getElementById("icInput").value.trim();

    if(ic==""){
        alert("Sila masukkan No. IC");
        return;
    }

    try{
	
		console.log(API_URL);
		console.log(ic);
		
        let response = await fetch(API_URL + "?action=semak&ic=" + encodeURIComponent(ic));
		

        let data = await response.json();

        if(data.status){

            localStorage.setItem("peserta", JSON.stringify(data));
		   //localStorage.setItem("ic", data.ic);

            window.location.href="maklumat.html";

        }else{

            alert("❌ No. IC tidak dijumpai.");

        }

    }catch(err){

        alert("Tidak dapat berhubung dengan server.");

        console.log(err);

    }

}
	</script>
